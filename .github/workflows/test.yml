name: Test

# The checks' own controls. push only, not pull_request: PRs to this repository
# are signing PRs from outside forks, and nothing they contain should run.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest test_cla
